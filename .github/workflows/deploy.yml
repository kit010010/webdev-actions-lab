name: Deploy Static Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      # Challenge: ตรวจว่ามี index.html และไฟล์นั้นมีแท็ก <title> ก่อน Deploy
      - name: Validate index.html
        run: |
          test -f index.html || { echo "::error::index.html not found"; exit 1; }
          grep -q "<title>" index.html || { echo "::error::index.html has no <title>"; exit 1; }
          echo "index.html OK"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
